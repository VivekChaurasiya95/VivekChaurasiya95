name: Generate Space Shooter Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Runs once a day
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Space Shooter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --upgrade pip
          pip install gh-space-shooter
          mkdir -p output
          gh-space-shooter VivekChaurasiya95 \
            --output output/space-shooter.gif \
            --strategy random \
            --fps 40
      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/space-shooter.gif
          git commit -m "Update space-shooter contribution graph" || echo "No changes to commit"
          git push
